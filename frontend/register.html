<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | BlogSphere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <a class="brand" href="index.html">Blog<span>Sphere</span></a>
            <h1>Create your account</h1>
            <p class="muted">Join the community and share your ideas.</p>

            <form id="registerForm">
                <label for="name">Full name</label>
                <input id="name" type="text" maxlength="100" required autocomplete="name">

                <label for="email">Email address</label>
                <input id="email" type="email" maxlength="150" required autocomplete="email">

                <label for="password">Password</label>
                <input id="password" type="password" minlength="8" required autocomplete="new-password">

                <button class="primary-button full-width" type="submit">Create Account</button>
                <p id="message" class="form-message" role="status"></p>
            </form>

            <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.textContent = "Creating account...";
            message.className = "form-message";

            const payload = {
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            };

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Registration failed.");
                }

                message.textContent = "Account created successfully! Redirecting to login...";
                message.className = "form-message success";

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1000);
            } catch (error) {
                message.textContent = error.message;
                message.className = "form-message error";
            }
        });
    </script>
</body>
</html>
