<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BlogSphere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <a class="brand" href="index.html">Blog<span>Sphere</span></a>
            <h1>Welcome back</h1>
            <p class="muted">Log in to continue to BlogSphere.</p>

            <form id="loginForm">
                <label for="email">Email address</label>
                <input id="email" type="email" required autocomplete="email">

                <label for="password">Password</label>
                <input id="password" type="password" required autocomplete="current-password">

                <button class="primary-button full-width" type="submit">Log In</button>
                <p id="message" class="form-message" role="status"></p>
            </form>

            <p class="auth-footer">New to BlogSphere? <a href="register.html">Create an account</a></p>
        </section>
    </main>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.textContent = "Signing you in...";
            message.className = "form-message";

            const payload = {
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            };

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Login failed.");
                }

                localStorage.setItem("blogsphere_token", data.token);
                localStorage.setItem("blogsphere_user", JSON.stringify(data.user));

                message.textContent = "Login successful!";
                message.className = "form-message success";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 500);
            } catch (error) {
                message.textContent = error.message;
                message.className = "form-message error";
            }
        });
    </script>
</body>
</html>
