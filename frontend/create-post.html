<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a Story | BlogSphere</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .editor-container {
            max-width: 850px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .editor-card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            border: 1px solid #e8e9f1;
            box-shadow: 0 12px 40px rgba(31,35,70,.05);
        }

        .editor-card h1 {
            margin-bottom: 10px;
        }

        .editor-card label {
            display: block;
            margin: 22px 0 8px;
            font-weight: 700;
        }

        .editor-card input,
        .editor-card textarea,
        .editor-card select {
            width: 100%;
            padding: 14px;
            border: 1px solid #dfe2ec;
            border-radius: 10px;
            font: inherit;
        }

        .editor-card textarea {
            min-height: 300px;
            resize: vertical;
            line-height: 1.7;
        }

        .editor-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .secondary-button {
            display: inline-block;
            padding: 14px 18px;
            border: 1px solid #dfe2ec;
            border-radius: 10px;
            color: #182033;
            font-weight: 700;
        }

        #message {
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <header class="navbar">
        <a class="brand" href="index.html">Blog<span>Sphere</span></a>
        <nav class="nav-links">
            <a href="index.html">Explore Stories</a>
        </nav>
    </header>

    <main class="editor-container">
        <section class="editor-card">
            <span class="category-tag">CREATE SOMETHING NEW</span>

            <h1>Write your story ✍️</h1>
            <p class="muted">
                Share your knowledge, experiences, and ideas with the community.
            </p>

            <form id="postForm">
                <label for="title">Story title</label>
                <input
                    id="title"
                    type="text"
                    maxlength="200"
                    placeholder="Give your story a great title..."
                    required
                >

                <label for="category">Category</label>
                <select id="category">
                    <option value="Technology">Technology</option>
                    <option value="Education">Education</option>
                    <option value="Business">Business</option>
                    <option value="Lifestyle">Lifestyle</option>
                    <option value="Programming">Programming</option>
                    <option value="Personal">Personal</option>
                    <option value="General" selected>General</option>
                </select>

                <label for="content">Your story</label>
                <textarea
                    id="content"
                    placeholder="Start writing your story here..."
                    required
                ></textarea>

                <div class="editor-actions">
                    <button class="primary-button" type="submit">
                        Publish Story →
                    </button>

                    <a class="secondary-button" href="index.html">
                        Cancel
                    </a>
                </div>

                <p id="message" class="form-message" role="status"></p>
            </form>
        </section>
    </main>

    <script>
        const token = localStorage.getItem("blogsphere_token");
        const form = document.getElementById("postForm");
        const message = document.getElementById("message");

        if (!token) {
            window.location.replace("login.html");
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!token) {
                window.location.href = "login.html";
                return;
            }

            const title = document.getElementById("title").value.trim();
            const content = document.getElementById("content").value.trim();
            const category = document.getElementById("category").value;

            if (!title || !content) {
                message.textContent = "Please enter a title and story.";
                message.className = "form-message error";
                return;
            }

            const button = form.querySelector("button[type='submit']");
            button.disabled = true;
            button.textContent = "Publishing...";

            try {
                const response = await fetch("/api/posts", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        title,
                        content,
                        category
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Unable to publish story.");
                }

                message.textContent = "Story published successfully!";
                message.className = "form-message success";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);

            } catch (error) {
                message.textContent = error.message;
                message.className = "form-message error";
            } finally {
                button.disabled = false;
                button.textContent = "Publish Story →";
            }
        });
    </script>
</body>
</html>
